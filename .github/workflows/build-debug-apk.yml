# Build GTA-2.11 debug APK and publish it as a GitHub Release.
# Trigger: push to main, or manual (Actions -> Build GTA-2.11 debug APK
# -> Run workflow).
# Debug APK needs no signing secrets, so it can be used to test the
# textdraw fix right away. Release APK still needs a signing keystore.
name: Build GTA-2.11 debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (created if missing)"
        required: false
        default: "gta-2.11-textdraw-fix"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # FIX (run 40647859742 failed here): android-actions/setup-android@v3
      # with no inputs failed on this repo, and the same bare step failed
      # before on a similar repo while the preinstalled-SDK route worked.
      # ubuntu-latest already ships an Android SDK, so install the exact
      # packages this project needs with its own sdkmanager instead.
      - name: Install Android SDK packages (preinstalled SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;26.2.11394342"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish release with debug APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/debug/GTA-2.11-debug.apk"
          ls -lh "$APK"
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="gta-2.11-textdraw-fix"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "GTA-2.11 textdraw fix" \
              --notes "Debug APK for GTA-2.11 with textdraw support fixed: ScrShowTextDraw handler restored and CTextDrawPool::Draw() called from Render2dStuff. Debug build, no signing keystore needed."
          fi
